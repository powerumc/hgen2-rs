name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          package="hgen2-${{ matrix.name }}"
          mkdir -p "dist/${package}"

          cp "target/${{ matrix.target }}/release/hgen2" "dist/${package}/"
          cp README.md hgen2.config.yaml "dist/${package}/"

          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hgen2-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-rocky8:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: rockylinux:8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rocky8-amd64
            runner: ubuntu-24.04
          - name: rocky8-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install build dependencies
        run: dnf install -y curl gcc make tar gzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          package="hgen2-${{ matrix.name }}"
          mkdir -p "dist/${package}"

          cp "target/release/hgen2" "dist/${package}/"
          cp README.md hgen2.config.yaml "dist/${package}/"

          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hgen2-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build
      - build-rocky8
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --title "${TAG}" \
              --notes "Release ${TAG}"
          fi

          gh release upload "${TAG}" dist/*.tar.gz --repo "${REPO}" --clobber
