[package]
name = "hgen2-rs"
version = "0.1.1"
edition = "2024"
description = "OSI Layer 2 Ethernet traffic generator that emits raw Ethernet/TCP/HTTP frames through a NIC"
repository = "https://github.com/powerumc/hgen2-rs"

[[bin]]
name = "hgen2"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "color"] }
pnet = { version = "0.35" }
log = { version = "0.4" }
simple_logger = { version = "5.2" }
anyhow = { version = "1", features = ["backtrace"] }
fake = { version = "5.1" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { version = "0.9" }
cidr = { version = "0.3", features = ["serde"] }
rand = { version = "0.10" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
regex = { version = "1" }
thousands = { version = "0.2" }
