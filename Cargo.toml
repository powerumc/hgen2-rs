[package]
name = "httpgen"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive", "color"] }
pnet = { version = "0.35" }
log = { version = "0.4" }
simple_logger = { version = "5.2" }
anyhow = { version = "1", features = ["backtrace"] }
fake = { version = "5.1" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { version = "0.9" }
cidr = { version = "0.3", features = ["serde"] }
rand = { version = "0.10" }
